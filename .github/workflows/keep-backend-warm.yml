name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -m 30 https://fitness-agent-wuvh.onrender.com/health || \
          (echo "Health check failed" && exit 1)
