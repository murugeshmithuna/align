name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --retry 5 --retry-all-errors --retry-delay 10 -m 60 \
            https://fitness-agent-wuvh.onrender.com/health
