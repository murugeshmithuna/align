<svg viewBox="0 0 1160 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1160" height="460" fill="#0b1416" />

  <!-- Frontend -->
  <rect x="40" y="190" width="150" height="80" rx="10" fill="#132024" stroke="#2d4a4f" stroke-width="1.5" />
  <text x="115" y="224" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">React</text>
  <text x="115" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">Vite SPA</text>

  <!-- FastAPI -->
  <rect x="250" y="190" width="150" height="80" rx="10" fill="#132024" stroke="#2d4a4f" stroke-width="1.5" />
  <text x="325" y="224" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">FastAPI</text>
  <text x="325" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">+ PostgreSQL</text>

  <!-- Haiku router -->
  <rect x="460" y="90" width="170" height="80" rx="10" fill="#1a1006" stroke="#5a3a1a" stroke-width="1.5" />
  <text x="545" y="124" fill="#fbbf24" font-size="15" font-weight="600" text-anchor="middle">Haiku router</text>
  <text x="545" y="144" fill="#94a3b8" font-size="12" text-anchor="middle">cheap triage pass</text>

  <!-- Opus reasoner -->
  <rect x="460" y="290" width="170" height="90" rx="10" fill="#1a1006" stroke="#5a3a1a" stroke-width="1.5" />
  <text x="545" y="320" fill="#fbbf24" font-size="15" font-weight="600" text-anchor="middle">Opus</text>
  <text x="545" y="340" fill="#94a3b8" font-size="12" text-anchor="middle">9 tools</text>
  <text x="545" y="358" fill="#94a3b8" font-size="11" text-anchor="middle">plan, log, schedule, form, nutrition…</text>

  <!-- RAG -->
  <rect x="710" y="40" width="160" height="70" rx="10" fill="#0e1a12" stroke="#1f4a2e" stroke-width="1.5" />
  <text x="790" y="70" fill="#4ade80" font-size="14" font-weight="600" text-anchor="middle">RAG</text>
  <text x="790" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">ChromaDB form tips</text>

  <!-- MediaPipe -->
  <rect x="710" y="130" width="160" height="70" rx="10" fill="#0e1a12" stroke="#1f4a2e" stroke-width="1.5" />
  <text x="790" y="160" fill="#4ade80" font-size="14" font-weight="600" text-anchor="middle">MediaPipe</text>
  <text x="790" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">pose / rep tracking</text>

  <!-- Claude Vision -->
  <rect x="710" y="220" width="160" height="70" rx="10" fill="#0e1a12" stroke="#1f4a2e" stroke-width="1.5" />
  <text x="790" y="250" fill="#4ade80" font-size="14" font-weight="600" text-anchor="middle">Claude Vision</text>
  <text x="790" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">meal photo analysis</text>

  <!-- Banister model -->
  <rect x="710" y="310" width="160" height="70" rx="10" fill="#0e1a12" stroke="#1f4a2e" stroke-width="1.5" />
  <text x="790" y="340" fill="#4ade80" font-size="14" font-weight="600" text-anchor="middle">Banister model</text>
  <text x="790" y="360" fill="#94a3b8" font-size="11" text-anchor="middle">fitness/fatigue (no LLM)</text>

  <!-- Guardrails -->
  <rect x="930" y="170" width="190" height="120" rx="10" fill="#1a0e14" stroke="#4a1f36" stroke-width="1.5" />
  <text x="1025" y="200" fill="#fb7185" font-size="14" font-weight="600" text-anchor="middle">Deterministic guardrails</text>
  <text x="1025" y="224" fill="#94a3b8" font-size="11" text-anchor="middle">per-user session auth</text>
  <text x="1025" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">write-tool allowlist (guest)</text>
  <text x="1025" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">per-user rate limiting</text>
  <text x="1025" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">response validated vs. DB</text>

  <!-- Arrows -->
  <line x1="190" y1="230" x2="248" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="210" x2="458" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="250" x2="458" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="545" y1="170" x2="545" y2="288" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="560" y="232" fill="#64748b" font-size="10">tool needed?</text>

  <line x1="630" y1="330" x2="708" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="630" y1="310" x2="708" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="630" y1="300" x2="708" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="630" y1="290" x2="708" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="870" y1="230" x2="928" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="600" y="420" fill="#64748b" font-size="12" text-anchor="middle">
    One agent, several tools - a deterministic pre-filter and guardrail layer around every Claude call, not just a prompt.
  </text>
</svg>
